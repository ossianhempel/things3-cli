name: Things skill parity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-published-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          path: things3-cli

      - name: Checkout private mirror repository main (read only)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ossianhempel/agent-scripts
          ref: main
          ssh-key: ${{ secrets.AGENT_SCRIPTS_DEPLOY_KEY }}
          persist-credentials: false
          path: agent-scripts

      - name: Compare published Things skills
        run: |
          canonical="$GITHUB_WORKSPACE/things3-cli/skills/things/SKILL.md"
          mirror="$GITHUB_WORKSPACE/agent-scripts/skills/things/SKILL.md"
          if ! cmp -s "$canonical" "$mirror"; then
            echo "Published Things skill drift detected:" >&2
            echo "  canonical: things3-cli/main:skills/things/SKILL.md" >&2
            echo "  mirror:    agent-scripts/main:skills/things/SKILL.md" >&2
            diff -u "$mirror" "$canonical" >&2 || true
            exit 1
          fi
          echo "Published Things skills match byte-for-byte."
